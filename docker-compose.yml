version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: markethub-postgres
    environment:
      POSTGRES_DB: markethub
      POSTGRES_USER: markethub
      POSTGRES_PASSWORD: markethub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markethub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: