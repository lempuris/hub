# Test Configuration for Market Data Hub
# This configuration uses H2 in-memory database for testing without external dependencies

spring.application.name=markethub-test

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Use H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable TimescaleDB for testing
timescale.enabled=false

# FIX Protocol Configuration
fix.beginString=FIX.4.4
fix.senderCompId=MARKETHUB
fix.acceptorPort=9876
fix.heartbeatInterval=30
fix.reconnectInterval=5
fix.dataDictionary=true
fix.logPath=logs/fix
fix.fileStorePath=data/fix

# Simplified Hazelcast for testing
hazelcast.cluster.name=markethub-test-cluster

# Actuator/Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.com.refinitiv.markethub=DEBUG