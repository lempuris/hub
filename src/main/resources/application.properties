# Market Data Hub Configuration
spring.application.name=markethub

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration - PostgreSQL for operational data
spring.datasource.url=jdbc:postgresql://localhost:5432/markethub
spring.datasource.username=markethub
spring.datasource.password=markethub
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# TimescaleDB Configuration (optional for market data storage)
timescale.enabled=false
timescale.retention.days=1

# FIX Protocol Configuration
fix.beginString=FIX.4.4
fix.senderCompId=MARKETHUB
fix.acceptorPort=9876
fix.heartbeatInterval=30
fix.reconnectInterval=5
fix.dataDictionary=true
fix.logPath=logs/fix
fix.fileStorePath=data/fix

# Hazelcast Configuration
hazelcast.cluster.name=markethub-cluster
hazelcast.network.port=5701
hazelcast.network.port.auto.increment=true

# Actuator/Monitoring Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.refinitiv.markethub=DEBUG
logging.level.quickfix=INFO
logging.level.com.hazelcast=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN

# Logging pattern for better readability
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# File logging
logging.file.name=logs/markethub.log
logging.file.max-size=100MB
logging.file.max-history=30

# Thread Pool Configuration
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=1000
spring.task.scheduling.pool.size=5

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.deserialization.fail-on-unknown-properties=false

# Application-specific Configuration
markethub.market-data.cache.enabled=true
markethub.market-data.cache.ttl-minutes=60
markethub.interpolation.enabled=true
markethub.interpolation.method=LINEAR
